name: Scope

# Pull requests from anyone but the owner may only change files in mac/ (see AGENTS.md).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  mac-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check changed files
        if: github.event.pull_request.user.login != github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          outside=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' | grep -v '^mac/' || true)
          if [ -n "$outside" ]; then
            echo "::error::Only files in mac/ may change in this pull request. Outside mac/:"
            echo "$outside"
            exit 1
          fi
          echo "All changed files are in mac/."
